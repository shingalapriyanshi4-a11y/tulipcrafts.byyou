<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tulipcrafts.byyou</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        body {
            background-color: var(--color-off-white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-container {
            background: var(--color-white);
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--color-peach-dark);
            font-style: italic;
            margin-bottom: 10px;
            display: block;
        }

        .auth-subtitle {
            color: var(--color-text-light);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        /* Google Button */
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            background-color: var(--color-white);
            color: var(--color-text-main);
            border: 1px solid #ddd;
            border-radius: 30px;
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        .btn-google:hover {
            background-color: var(--color-off-white);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .btn-google img {
            width: 24px;
            height: 24px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: var(--color-text-light);
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }

        .divider:not(:empty)::before {
            margin-right: .25em;
        }

        .divider:not(:empty)::after {
            margin-left: .25em;
        }

        /* Standard Form */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--color-text-main);
            font-size: 0.95rem;
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 1rem;
            background-color: var(--color-off-white);
            transition: border-color var(--transition-fast);
            box-sizing: border-box;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--color-peach-dark);
            background-color: var(--color-white);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 1.05rem;
            margin-top: 10px;
        }

        .auth-links {
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--color-text-light);
        }
        .auth-links a {
            color: var(--color-peach-dark);
            font-weight: bold;
            text-decoration: underline;
        }
        .auth-links a:hover {
            color: var(--color-text-main);
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 0.9rem;
            color: var(--color-text-light);
            text-decoration: none;
        }
        .back-home:hover {
            color: var(--color-peach-dark);
        }

    </style>
</head>
<body>

    <div class="auth-container animate-slide-up">
        <a href="index.html" class="back-home">← Home</a>
        
        <a href="index.html" class="logo">Tulipcrafts.byyou</a>
        <p class="auth-subtitle">Welcome! Sign in or create an account.</p>

        <!-- Google Login Button -->
        <button class="btn-google">
            <svg viewBox="0 0 48 48" style="width:24px; height:24px;">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                <path fill="none" d="M0 0h48v48H0z"></path>
            </svg>
            Continue with Google
        </button>

        <div class="divider">or</div>

        <!-- Standard Email Login -->
        <form action="#" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-submit">Continue with Email</button>
        </form>

        <div class="auth-links">
            By continuing, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
        </div>
    </div>

</body>
</html>
